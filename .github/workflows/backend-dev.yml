name: Backend integration

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ARM / Python ${{ matrix.python }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install built engine and backend packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install './libs/core[dev]' './libs/mcp[dev]' './libs/benchmarks[dev]'
          echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Rust checks
        working-directory: libs/core
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --features python -- -D warnings
          cargo test --locked --features python
      - name: Installed engine tests
        run: |
          cp -R libs/core/tests "$RUNNER_TEMP/core-tests"
          cd "$RUNNER_TEMP"
          python -m pytest --rootdir="$RUNNER_TEMP/core-tests" "$RUNNER_TEMP/core-tests/python" -q
      - name: MCP and benchmark contracts
        run: |
          python -m pytest libs/mcp/tests -q
          python -m pytest libs/benchmarks/tests -q
