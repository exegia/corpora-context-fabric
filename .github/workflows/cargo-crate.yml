name: Cargo crate

on:
  pull_request:
    branches: [dev]
    paths: ['libs/core/**', '.github/workflows/cargo-crate.yml']
  push:
    branches: [dev]
    paths: ['libs/core/**', '.github/workflows/cargo-crate.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified RC crate to crates.io (requires environment approval)
        type: boolean
        default: false
      version:
        description: Exact Cargo version to validate
        type: string
        default: '0.6.0-rc.1'

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Require configured publication approval
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/environments/crates-io" > "$RUNNER_TEMP/crates-environment.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          env = json.loads((Path(os.environ['RUNNER_TEMP']) / 'crates-environment.json').read_text())
          approvals = [r for r in env['protection_rules'] if r['type'] == 'required_reviewers']
          assert any(r.get('reviewers') and r.get('prevent_self_review') for r in approvals), 'Configure required reviewers and prevent self-review in crates-io before publishing'
          PYTHON
      - name: Validate crate identity and RC version
        env:
          EXPECTED_VERSION: ${{ inputs.version || '0.6.0-rc.1' }}
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          package = tomllib.loads(Path('Cargo.toml').read_text())['package']
          assert package['name'] == 'context_fabric_core', package['name']
          assert package['version'] == os.environ['EXPECTED_VERSION'], package['version']
          PYTHON
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo doc --locked --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package and verify standalone crate
        run: cargo package --locked --no-default-features
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: context-fabric-cargo-${{ github.sha }}
          path: libs/core/target/package/*.crate
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: context-fabric-cargo-${{ github.sha }}
          path: artifact
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Unpack the verified artifact
        run: |
          mkdir package
          tar -xzf artifact/*.crate -C package
          # Cargo regenerates this reserved manifest backup when packaging.
          find package -name Cargo.toml.orig -delete
      - name: Publish verified crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE_VERSION: ${{ inputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked --manifest-path "package/context_fabric_core-$CRATE_VERSION/Cargo.toml"
